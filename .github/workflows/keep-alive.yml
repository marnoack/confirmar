name: Keep Alive - Streamlit + Supabase

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas (hora UTC); GitHub puede demorarlo unos minutos
  workflow_dispatch:          # botón "Run workflow" para probarlo a mano

jobs:
  supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Hacer una consulta a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Llama a la función pública con un código que no existe: no lee ni
          # cambia datos de nadie, pero cuenta como actividad del proyecto.
          headers=(-H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json")
          if [[ "$SUPABASE_KEY" == eyJ* ]]; then
            headers+=(-H "Authorization: Bearer $SUPABASE_KEY")  # clave "anon" antigua
          fi
          estado=$(curl -s -o respuesta.txt -w "%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/obtener_invitacion" "${headers[@]}" \
            -d '{"p_codigo": "ping"}')
          echo "Supabase respondió $estado: $(cat respuesta.txt)"
          test "$estado" = "200"

  streamlit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar navegador
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Abrir la app (y despertarla si está dormida)
        env:
          STREAMLIT_APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: python .github/scripts/wake_streamlit.py
